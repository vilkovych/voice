name: earworm
on:
  push:
    branches: [earworm]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: earworm
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pip install -q -U "yt-dlp[default]"
      - name: Забрати вже зібрані уроки з сайту, щоб не збирати їх знову
        run: |
          mkdir -p app/lessons
          if git fetch -q --depth 1 origin gh-pages; then
            git archive origin/gh-pages lessons 2>/dev/null | tar -x -C app || true
          fi
          ls app/lessons | wc -l
      - name: Зібрати уроки
        run: python3 build.py
      - name: Викласти сайт (без нових перекладів)
        run: |
          cp build-report.txt app/ || true
          cd app
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="earworm-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Earworm: сайт $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
      - name: Перекласти українською
        timeout-minutes: 30
        continue-on-error: true
        run: python3 translate_google.py
      - name: Викласти сайт з перекладом
        run: |
          cp build-report.txt app/ || true
          rm -rf app/.git
          cd app
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="earworm-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Earworm: сайт $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
