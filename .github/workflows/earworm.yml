name: earworm
on:
  push:
    branches: [earworm]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: earworm
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pip install -q -U "yt-dlp[default]"
      - name: Забрати вже зібрані уроки з сайту, щоб не збирати їх знову
        run: |
          mkdir -p app/lessons
          if git fetch -q --depth 1 origin gh-pages; then
            git archive origin/gh-pages lessons 2>/dev/null | tar -x -C app || true
          fi
          ls app/lessons | wc -l
      - name: Перевірка перекладача (чи пустить він запити з сайту)
        continue-on-error: true
        run: |
          curl -s -m 15 -D - -o /dev/null -H 'Origin: https://vilkovych.github.io' 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=uk&dt=t&q=hello' | grep -iE '^HTTP|access-control' || true
          curl -s -m 15 -D - -o /dev/null -H 'Origin: https://vilkovych.github.io' 'https://api.mymemory.translated.net/get?langpair=en|uk&q=hello' | grep -iE '^HTTP|access-control' || true
      - name: Зібрати уроки
        env:
          EARWORM_SKIP_VIDEO: "1"
        run: python3 build.py
      - name: Викласти сайт у gh-pages
        run: |
          cp build-report.txt app/ || true
          cd app
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="earworm-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Earworm: сайт $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
